<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ксения — локальный дворецкий</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080b10; color: #f7f8fa; font-size: 21px; line-height: 1.5; }
    main { width: min(900px, 100%); margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(32px, 8vw, 56px); }
    .muted { color: #bcc6d4; }
    .card { margin-top: 20px; padding: 22px; border: 2px solid #465267; border-radius: 18px; background: #111722; }
    label { display: block; margin-bottom: 10px; font-weight: 700; }
    input, textarea, button { width: 100%; min-height: 58px; border-radius: 12px; font: inherit; }
    input, textarea { padding: 14px; color: #fff; background: #06080c; border: 2px solid #8290a5; }
    textarea { min-height: 150px; resize: vertical; }
    input:focus, textarea:focus, button:focus { outline: 4px solid #ffd43b; outline-offset: 3px; }
    button { margin-top: 14px; padding: 12px 18px; border: 0; background: #40c057; color: #061208; font-weight: 800; cursor: pointer; }
    button:disabled { background: #667080; color: #d9dee7; cursor: wait; }
    .danger { background: #e03131; color: #fff; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    #status { font-size: clamp(28px, 7vw, 44px); font-weight: 800; color: #ffd43b; }
    #answer { white-space: pre-wrap; font-size: clamp(22px, 5vw, 30px); }
    #events { margin: 12px 0 0; padding-left: 28px; color: #d4dbe6; }
    .error { color: #ff8787; font-weight: 700; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Ксения</h1>
    <div class="muted">Локальный дворецкий-разработчик</div>

    <section id="login" class="card" aria-labelledby="login-title">
      <h2 id="login-title">Подключение</h2>
      <label for="pin">PIN, показанный на компьютере</label>
      <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="12" aria-describedby="pin-help">
      <p id="pin-help" class="muted">Введите шесть цифр и нажмите Enter.</p>
      <button id="login-button" type="button" aria-keyshortcuts="Enter">Подключиться</button>
      <p id="login-error" class="error" role="alert"></p>
    </section>

    <section id="chat" hidden>
      <div class="card" aria-live="polite" aria-atomic="true">
        <div class="muted">Состояние</div>
        <div id="status">Готова</div>
        <div id="task-controls" class="actions" hidden aria-label="Управление текущей задачей">
          <button id="pause" type="button">Пауза</button>
          <button id="resume" type="button" hidden>Продолжить</button>
          <button id="cancel" class="danger" type="button">Отменить задачу</button>
        </div>
      </div>

      <div class="card">
        <label for="message">Что нужно сделать?</label>
        <textarea id="message" placeholder="Напишите задачу для Ксении" aria-describedby="message-help"></textarea>
        <p id="message-help" class="muted">Control и Enter — отправить задачу.</p>
        <button id="send" type="button" aria-keyshortcuts="Control+Enter">Отправить</button>
      </div>

      <div class="card" aria-live="polite">
        <h2>Ответ</h2>
        <div id="answer">Здесь появится ответ.</div>
        <ul id="events" aria-label="Этапы выполнения"></ul>
      </div>

      <div id="confirmation" class="card" hidden aria-live="assertive">
        <h2>Нужно подтверждение</h2>
        <div id="confirmation-text"></div>
        <div class="actions">
          <button id="approve" type="button">Да, выполнить</button>
          <button id="reject" class="danger" type="button" aria-keyshortcuts="Escape">Нет, отменить</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const login = document.querySelector('#login');
    const chat = document.querySelector('#chat');
    const pinInput = document.querySelector('#pin');
    const loginButton = document.querySelector('#login-button');
    const loginError = document.querySelector('#login-error');
    const message = document.querySelector('#message');
    const send = document.querySelector('#send');
    const status = document.querySelector('#status');
    const taskControls = document.querySelector('#task-controls');
    const pause = document.querySelector('#pause');
    const resume = document.querySelector('#resume');
    const cancel = document.querySelector('#cancel');
    const answer = document.querySelector('#answer');
    const events = document.querySelector('#events');
    const confirmation = document.querySelector('#confirmation');
    const confirmationText = document.querySelector('#confirmation-text');
    const approve = document.querySelector('#approve');
    const reject = document.querySelector('#reject');
    let pin = sessionStorage.getItem('butler-pin') || '';
    let currentTaskId = '';
    let lastStatus = '';
    let lastEvents = '';
    let confirmationWasVisible = false;

    async function authenticate(candidate) {
      const response = await fetch('/api/auth', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({pin: candidate})
      });
      if (!response.ok) throw new Error('Неверный PIN');
      pin = candidate;
      sessionStorage.setItem('butler-pin', pin);
      login.hidden = true;
      chat.hidden = false;
      message.focus();
    }

    loginButton.addEventListener('click', async () => {
      loginError.textContent = '';
      try { await authenticate(pinInput.value.trim()); }
      catch (error) {
        loginError.textContent = error.message;
        pinInput.focus();
        pinInput.select();
      }
    });
    pinInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') loginButton.click();
    });

    async function taskState(taskId) {
      const response = await fetch(`/api/tasks/${taskId}`, {headers: {'X-Butler-Pin': pin}});
      if (!response.ok) throw new Error('Связь с Ксенией потеряна');
      return response.json();
    }

    function render(task) {
      if (task.status !== lastStatus) {
        status.textContent = task.status;
        lastStatus = task.status;
      }
      const eventSignature = JSON.stringify(task.events.map(item => item.status));
      if (eventSignature !== lastEvents) {
        events.replaceChildren(...task.events.map(item => {
          const li = document.createElement('li');
          li.textContent = item.status;
          return li;
        }));
        lastEvents = eventSignature;
      }
      if (task.answer) answer.textContent = task.answer;
      if (task.error) {
        answer.textContent = task.error;
        answer.className = 'error';
      }
      currentTaskId = task.id;
      taskControls.hidden = task.done;
      const paused = task.status === 'Приостановлено';
      pause.hidden = paused || task.done;
      resume.hidden = !paused || task.done;
      cancel.hidden = task.done;
      confirmation.hidden = !task.confirmation;
      if (task.confirmation) {
        confirmationText.textContent = task.confirmation.message;
        if (!confirmationWasVisible) approve.focus();
      }
      confirmationWasVisible = Boolean(task.confirmation);
    }

    async function decide(approved) {
      if (!currentTaskId) return;
      approve.disabled = reject.disabled = true;
      try {
        const response = await fetch(`/api/tasks/${currentTaskId}/confirmation`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Butler-Pin': pin},
          body: JSON.stringify({approved})
        });
        if (!response.ok) throw new Error('Не удалось передать решение');
        confirmation.hidden = true;
      } finally {
        approve.disabled = reject.disabled = false;
        confirmationWasVisible = false;
        message.focus();
      }
    }

    approve.addEventListener('click', () => decide(true));
    reject.addEventListener('click', () => decide(false));

    async function controlTask(action) {
      if (!currentTaskId) return;
      pause.disabled = resume.disabled = cancel.disabled = true;
      try {
        const response = await fetch(`/api/tasks/${currentTaskId}/control`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Butler-Pin': pin},
          body: JSON.stringify({action})
        });
        if (!response.ok) throw new Error('Не удалось изменить состояние задачи');
        render(await response.json());
      } finally {
        pause.disabled = resume.disabled = cancel.disabled = false;
      }
    }

    pause.addEventListener('click', () => controlTask('pause'));
    resume.addEventListener('click', () => controlTask('resume'));
    cancel.addEventListener('click', () => controlTask('cancel'));
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !confirmation.hidden) {
        event.preventDefault();
        decide(false);
      }
    });

    async function poll(taskId) {
      while (true) {
        const task = await taskState(taskId);
        render(task);
        if (task.done) return;
        await new Promise(resolve => setTimeout(resolve, 700));
      }
    }

    send.addEventListener('click', async () => {
      const text = message.value.trim();
      if (!text) { message.focus(); return; }
      send.disabled = true;
      answer.className = '';
      answer.textContent = 'Задача принята.';
      events.replaceChildren();
      try {
        const response = await fetch('/api/tasks', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Butler-Pin': pin},
          body: JSON.stringify({message: text})
        });
        if (!response.ok) throw new Error('Не удалось отправить задачу');
        const task = await response.json();
        message.value = '';
        await poll(task.id);
      } catch (error) {
        status.textContent = 'Ошибка';
        answer.textContent = error.message;
        answer.className = 'error';
      } finally {
        send.disabled = false;
        message.focus();
      }
    });
    message.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.ctrlKey) {
        event.preventDefault();
        send.click();
      }
    });

    if (pin) authenticate(pin).catch(() => {
      sessionStorage.removeItem('butler-pin');
      pin = '';
      loginError.textContent = 'Сохранённый PIN не подошёл. Введите текущие шесть цифр.';
      pinInput.focus();
    });
    else pinInput.focus();
  </script>
</body>
</html>
