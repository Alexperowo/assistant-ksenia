name: Ошибка
description: Воспроизводимая проблема Ксении
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте пароли, PIN, токены, личные сообщения, модели, браузерный профиль или пользовательские файлы.
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: v0.1.0-alpha.1 или commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Среда
      description: Windows build, CPU, GPU/VRAM, RAM и способ запуска.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Безопасная диагностика
      description: Только очищенный фрагмент без разговоров, путей к личным файлам и секретов.
  - type: checkboxes
    id: checks
    attributes:
      label: Подтверждение
      options:
        - label: Я проверил, что в сообщении нет секретов и личных данных.
          required: true
        - label: Я поискал похожие Issues.
          required: true
